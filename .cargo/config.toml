[build]
rustc-wrapper = "/opt/homebrew/bin/sccache"

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-dead_strip"]

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
codegen-units = 16
incremental = true

[profile.test]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
codegen-units = 16
incremental = true
