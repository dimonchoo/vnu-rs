[workspace]
members = [
    "crates/vnu-core",
    "crates/vnu-parser",
    "crates/vnu-oracle",
    "crates/vnu-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dmytro Buhaiov"]
license = "MIT"

[workspace.dependencies]
memchr = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
html5ever = "0.29"
tendril = "0.4"
