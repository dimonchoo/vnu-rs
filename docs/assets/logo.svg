<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3" flood-color="#000"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" filter="url(#shadow)"/>

  <!-- Subtle Inner Border Accent -->
  <rect x="23" y="23" width="194" height="194" rx="41" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- HTML Brackets & Slash -->
  <!-- Left Bracket < -->
  <path d="M 76 80 L 52 108 L 76 136" fill="none" stroke="url(#rustGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Slash / -->
  <path d="M 128 72 L 96 144" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>

  <!-- Right Bracket > -->
  <path d="M 148 80 L 172 108 L 148 136" fill="none" stroke="url(#rustGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Brand Text -->
  <text x="112" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="21" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">vnu<tspan fill="#f97316">-rs</tspan></text>

  <!-- Green Check Badge -->
  <g transform="translate(170, 170)">
    <circle cx="0" cy="0" r="24" fill="url(#checkGrad)" stroke="#0f172a" stroke-width="4.5" filter="url(#shadow)"/>
    <path d="M -8 -1 L -3 5 L 8 -6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
